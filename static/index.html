<!doctype html>
<html lang="zh-CN" data-theme="olive-sage">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5ef">
  <title>Agent 对话 · agent-demo-1</title>
  <link href="./index.css" rel="stylesheet" type="text/css">
</head>

<body class="text-base-content">
  <main class="page chat-layout">
    <section class="panel chat-panel" aria-label="Agent 对话">
      <div class="chat-scroll" id="chat-scroll">
        <div class="welcome" id="welcome">
          <h1>有什么想了解的？</h1>
          <p>输入问题，开始对话。</p>
        </div>
        <ol class="messages" id="messages" aria-label="聊天记录" aria-live="polite" aria-relevant="additions text" hidden></ol>
      </div>
      <form class="composer" id="chat-form">
        <div class="composer-error" id="chat-error" hidden>
          <span id="error-message" role="alert"></span>
          <button class="retry-button" id="retry-button" type="button">重试</button>
        </div>
        <div class="composer-box">
          <label class="sr-only" for="question">输入你的问题</label>
          <textarea id="question" name="question" rows="2" maxlength="8000" placeholder="输入你的问题……" aria-describedby="composer-hint character-count" required></textarea>
          <div class="composer-actions">
            <span class="character-count" id="character-count">0 / 8,000</span>
            <button class="btn btn-primary primary-button send-button" id="send-button" type="submit" disabled><span id="send-label">发送</span><span aria-hidden="true">↑</span></button>
          </div>
        </div>
        <div class="composer-footer">
          <div class="conversation-actions">
            <button id="new-chat-button" type="button">新建对话</button>
            <a href="./doc.html">文档库</a>
          </div>
          <span class="keyboard-hint">Enter 发送 · Shift + Enter 换行</span>
        </div>
        <p class="sr-only" id="composer-hint">Enter 发送，Shift + Enter 换行。对话仅在当前页面保留，刷新后清空。</p>
        <span class="sr-only" id="chat-status" role="status">等待提问</span>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById("chat-form");
    const questionInput = document.getElementById("question");
    const sendButton = document.getElementById("send-button");
    const sendLabel = document.getElementById("send-label");
    const newChatButton = document.getElementById("new-chat-button");
    const retryButton = document.getElementById("retry-button");
    const chatStatus = document.getElementById("chat-status");
    const chatScroll = document.getElementById("chat-scroll");
    const welcome = document.getElementById("welcome");
    const messages = document.getElementById("messages");
    const chatError = document.getElementById("chat-error");
    const errorMessage = document.getElementById("error-message");
    const characterCount = document.getElementById("character-count");
    const maxLength = 8000;
    let history = [];
    let busy = false;
    let failedQuestion = "";

    function updateInput() {
      const length = Array.from(questionInput.value).length;
      characterCount.textContent = `${length.toLocaleString("en-US")} / 8,000`;
      sendButton.disabled = busy || !questionInput.value.trim() || length > maxLength;
    }

    function setBusy(value) {
      busy = value;
      questionInput.readOnly = value;
      newChatButton.disabled = value;
      retryButton.disabled = value;
      chatStatus.textContent = value ? "正在整理回答" : history.length ? "可继续追问" : "等待提问";
      sendLabel.textContent = value ? "等待回答" : "发送";
      updateInput();
    }

    function updateConversation() {
      welcome.hidden = messages.children.length > 0;
      messages.hidden = !welcome.hidden;
    }

    function scrollToLatest() {
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function createElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function appendMessage(role, content, {pending = false} = {}) {
      const item = createElement("li", `message message-${role}${pending ? " message-pending" : ""}`);
      const avatar = createElement("span", "message-avatar", role === "user" ? "你" : "AG");
      avatar.setAttribute("aria-hidden", "true");
      const body = createElement("div", "message-body");
      const heading = createElement("div", "message-heading", role === "user" ? "你" : "Agent 文档助手");
      const text = createElement("div", "message-text", content);
      if (pending) {
        const dots = createElement("span", "thinking-dots");
        dots.setAttribute("aria-hidden", "true");
        dots.append(document.createElement("i"), document.createElement("i"), document.createElement("i"));
        text.prepend(dots);
      }
      body.append(heading, text);
      item.append(avatar, body);
      messages.append(item);
      return item;
    }

    function renderAnswer(item, result) {
      item.classList.remove("message-pending");
      item.querySelector(".message-text").hidden = false;
      item.querySelector(".message-text").textContent = result.answer;
      item.querySelector(".message-heading").append(createElement("span", "route-label", result.route === "research" ? "文档检索" : "直接回答"));
      const body = item.querySelector(".message-body");
      if (result.sources.length) {
        const sources = createElement("details", "sources");
        sources.append(createElement("summary", "", `引用来源 · ${result.sources.length}`));
        const list = createElement("ul", "source-list");
        result.sources.forEach((source) => {
          const entry = createElement("li", "source-item");
          entry.append(
            createElement("span", "source-name", source.file_name),
            createElement("span", "source-meta", `引用 [${source.chunk_id}] · 相似度 ${source.score.toFixed(4)}`),
          );
          list.append(entry);
        });
        sources.append(list);
        body.append(sources);
      }
      if (Array.from(result.answer).length > maxLength) {
        body.append(createElement("p", "history-note", "这条回答较长，后续追问将使用其前 8,000 字作为上下文。"));
      }
    }

    async function readError(response) {
      const errors = {
        422: "问题或历史消息不符合要求，请将每条消息控制在 8,000 字以内。",
        502: "Agent 暂时无法回答，请稍后重试。",
        504: "回答等待超时，请稍后重试，或缩小问题范围。",
      };
      if (errors[response.status]) return errors[response.status];
      try {
        const payload = await response.json();
        if (typeof payload.detail === "string") return payload.detail;
      } catch {
        // Some servers return an HTML error page instead of JSON.
      }
      return `请求失败（${response.status}），请稍后重试。`;
    }

    function validateResult(result) {
      return result && typeof result.answer === "string" && result.answer.trim()
        && ["direct", "research"].includes(result.route) && Array.isArray(result.sources)
        && result.sources.every((source) => source && typeof source.file_name === "string"
          && typeof source.chunk_id === "string" && Number.isFinite(source.score));
    }

    function describeStep(event) {
      const data = event.data;
      const running = event.status === "running";
      const titles = {
        supervisor: "判断回答路径",
        researcher: `收集文档证据${data.round ? ` · 第 ${data.round} 轮` : ""}`,
        search_documents: "检索知识库",
        answerer: data.revising ? "修改回答" : "整理回答",
        reviewer: "审核回答与引用",
      };
      let detail = running ? "正在执行……" : "已完成";
      if (event.status === "error") detail = "执行失败";
      else if (!running) {
        if (event.node === "supervisor") detail = data.route === "research" ? "需要检索文档" : "可以直接回答";
        if (event.node === "researcher" || event.node === "search_documents") {
          detail = data.evidence_count ? `找到 ${data.evidence_count} 条相关证据` : "未找到新的相关证据";
          if (data.file_names?.length) detail += ` · ${data.file_names.join("、")}`;
        }
        if (event.node === "answerer") detail = "回答已整理";
        if (event.node === "reviewer") {
          detail = data.limit_reached ? "已达到处理轮数上限，将返回当前回答"
            : {pass: "审核通过", revise: "需要修改回答", more_research: "需要补充检索"}[data.verdict] || "审核完成";
        }
      }
      return {title: titles[event.node] || "处理问题", detail};
    }

    function createExecution(item) {
      const panel = createElement("details", "execution");
      panel.open = true;
      const summary = createElement("summary", "", "执行过程 · 正在连接");
      const list = createElement("ol", "execution-list");
      panel.append(summary, list);
      item.querySelector(".message-body").insertBefore(panel, item.querySelector(".message-text"));
      const steps = new Map();
      const started = performance.now();

      return {
        update(event) {
          if (event.type === "run.start") {
            summary.textContent = "执行过程 · 开始处理";
            item.querySelector(".message-text").hidden = true;
            return;
          }
          if (!["step.start", "step.end", "tool.start", "tool.end"].includes(event.type)) return;
          if (!event.step_id) throw new Error("执行事件缺少步骤标识，请重试。");
          const {title, detail} = describeStep(event);
          let step = steps.get(event.step_id);
          if (!step) {
            const row = createElement("li", `execution-step${event.type.startsWith("tool.") ? " execution-tool" : ""}`);
            const marker = createElement("span", "execution-marker");
            marker.setAttribute("aria-hidden", "true");
            const content = createElement("div", "execution-content");
            const name = createElement("span", "execution-name");
            const description = createElement("span", "execution-detail");
            const duration = createElement("span", "execution-duration");
            content.append(name, description);
            row.append(marker, content, duration);
            list.append(row);
            step = {row, marker, name, description, duration};
            steps.set(event.step_id, step);
          }
          step.row.dataset.status = event.status;
          step.marker.textContent = event.status === "running" ? "" : event.status === "error" ? "!" : "✓";
          step.name.textContent = title;
          step.description.textContent = detail;
          if (Number.isFinite(event.data.duration_ms)) step.duration.textContent = `${(event.data.duration_ms / 1000).toFixed(1)} 秒`;
          summary.textContent = `执行过程 · ${event.status === "running" ? title : detail}`;
          chatStatus.textContent = `${title}，${detail}`;
        },
        finish(success) {
          for (const step of steps.values()) {
            if (step.row.dataset.status !== "running") continue;
            step.row.dataset.status = "error";
            step.marker.textContent = "!";
            step.description.textContent = "执行中断";
          }
          summary.textContent = `执行过程 · ${success ? "已完成" : "未完成"} · ${((performance.now() - started) / 1000).toFixed(1)} 秒`;
          panel.open = !success;
          panel.classList.toggle("execution-failed", !success);
        },
      };
    }

    async function readEventStream(response, onEvent) {
      if (!response.body || !response.headers.get("content-type")?.includes("text/event-stream")) {
        throw new Error("未收到有效的执行事件流，请稍后重试。");
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let runId = null;
      let lastSeq = 0;
      try {
        while (true) {
          const {value, done} = await reader.read();
          buffer += done ? decoder.decode() : decoder.decode(value, {stream: true});
          let boundary;
          while ((boundary = /\r?\n\r?\n/.exec(buffer))) {
            const frame = buffer.slice(0, boundary.index);
            buffer = buffer.slice(boundary.index + boundary[0].length);
            const data = frame.split(/\r?\n/).filter((line) => line.startsWith("data:"))
              .map((line) => line.slice(5).replace(/^ /, "")).join("\n");
            if (!data) continue; // Heartbeat comments carry no event.
            let event;
            try {
              event = JSON.parse(data);
            } catch {
              throw new Error("执行事件格式不正确，请稍后重试。");
            }
            if (!event || typeof event.run_id !== "string" || !Number.isInteger(event.seq)
              || typeof event.type !== "string" || !event.data || typeof event.data !== "object") {
              throw new Error("执行事件不完整，请稍后重试。");
            }
            if (runId === null) runId = event.run_id;
            if (runId !== event.run_id || event.seq !== lastSeq + 1) throw new Error("执行事件顺序异常，请重试。");
            lastSeq = event.seq;
            if (onEvent(event)) return;
          }
          if (done) throw new Error("连接已中断，未收到完整回答，请重试。");
        }
      } finally {
        await reader.cancel().catch(() => {});
        reader.releaseLock();
      }
    }

    async function sendQuestion(value, {retry = false} = {}) {
      const question = value.trim();
      if (busy || !question || Array.from(question).length > maxLength) return;
      chatError.hidden = true;
      failedQuestion = "";
      setBusy(true);
      questionInput.value = "";
      updateInput();
      if (!retry) appendMessage("user", question);
      const assistantMessage = appendMessage("assistant", "正在连接，请稍候……", {pending: true});
      const answerText = assistantMessage.querySelector(".message-text");
      const execution = createExecution(assistantMessage);
      updateConversation();
      scrollToLatest();

      try {
        const response = await fetch("/chat/stream", {
          method: "POST",
          headers: {"Content-Type": "application/json", Accept: "text/event-stream"},
          body: JSON.stringify({question, history}),
        });
        if (!response.ok) throw new Error(await readError(response));
        let result;
        await readEventStream(response, (event) => {
          const nearBottom = chatScroll.scrollHeight - chatScroll.scrollTop - chatScroll.clientHeight < 80;
          if (event.type === "error") throw new Error(event.data.message || "执行失败，请重试。");
          if (event.type === "step.start" && event.node === "answerer") {
            answerText.textContent = "";
            answerText.hidden = true;
          }
          if (event.type === "answer.delta") {
            if (typeof event.data.text !== "string") throw new Error("回答片段格式不正确，请稍后重试。");
            assistantMessage.classList.remove("message-pending");
            answerText.hidden = false;
            answerText.append(document.createTextNode(event.data.text));
          }
          if (event.type === "answer.final") {
            if (!validateResult(event.data)) throw new Error("回答格式不完整，请稍后重试。");
            result = event.data;
          }
          if (event.type === "run.end") {
            if (!result || event.status !== "success") throw new Error("未收到完整回答，请稍后重试。");
            return true;
          }
          execution.update(event);
          if (nearBottom) scrollToLatest();
          return false;
        });
        execution.finish(true);
        renderAnswer(assistantMessage, result);
        // The API limits every history message to 8,000 Unicode characters.
        history.push(
          {role: "user", content: question},
          {role: "assistant", content: Array.from(result.answer.trim()).slice(0, maxLength).join("")},
        );
      } catch (error) {
        execution.finish(false);
        assistantMessage.classList.remove("message-pending");
        const text = assistantMessage.querySelector(".message-text");
        text.hidden = false;
        text.textContent = "未能完成回答，可查看上方执行过程并重试。";
        questionInput.value = question;
        failedQuestion = question;
        errorMessage.textContent = error instanceof TypeError ? "无法连接到聊天服务，请检查网络后重试。" : error.message || "发送失败，请重试。";
        chatError.hidden = false;
      } finally {
        setBusy(false);
        updateConversation();
        questionInput.focus({preventScroll: true});
        scrollToLatest();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendQuestion(questionInput.value);
    });
    questionInput.addEventListener("input", updateInput);
    questionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
        event.preventDefault();
        if (!sendButton.disabled) form.requestSubmit();
      }
    });
    retryButton.addEventListener("click", () => sendQuestion(failedQuestion, {retry: true}));
    newChatButton.addEventListener("click", () => {
      if (busy) return;
      history = [];
      failedQuestion = "";
      messages.replaceChildren();
      form.reset();
      chatError.hidden = true;
      setBusy(false);
      updateConversation();
      questionInput.focus({preventScroll: true});
      scrollToLatest();
    });
    updateInput();
  </script>
</body>

</html>
